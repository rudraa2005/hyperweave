[project]
name = "hyperweave"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["phase1: phase 1 tests", "global_gate: tests required in every phase"]

