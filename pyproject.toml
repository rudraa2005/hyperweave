[project]
name = "hyperweave"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
offline = ["torch>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["phase1: phase 1 tests", "phase2: phase 2 tests", "phase3: phase 3 tests", "phase4: phase 4 tests", "phase5: phase 5 tests", "global_gate: tests required in every phase"]

[tool.setuptools.package-data]
"hyperweave.demo" = ["static/*.html", "static/*.css", "static/*.js"]

